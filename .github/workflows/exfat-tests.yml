name: exFAT driver tests (QEMU)

on:
  push:
    paths:
      - 'fs/exfat/**'
      - 'tests/exfat-qemu/**'
      - '.github/workflows/exfat-tests.yml'
  pull_request:
    paths:
      - 'fs/exfat/**'
      - 'tests/exfat-qemu/**'
      - '.github/workflows/exfat-tests.yml'
  workflow_dispatch:

jobs:
  exfat:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build test kernel and run tests
        run: CONTAINER=docker tests/exfat-qemu/run.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: exfat-test-logs
          path: tests/exfat-qemu/work/*.log
